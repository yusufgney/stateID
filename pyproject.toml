[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stateid"
dynamic = ["version"]
description = "Give the current state of your GNOME desktop an ID and bring that moment back later; CLI and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "yusufgney" }]
# PyGObject (gi) with Gio, Atspi and GdkPixbuf comes from the system: python3-gi, gir1.2-atspi-2.0,
# gir1.2-gdkpixbuf-2.0. install.sh creates a virtualenv with --system-site-packages for that reason.
dependencies = ["mcp>=2.3,<3", "websockets>=12", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/yusufgney/stateID"

[project.scripts]
stateid = "stateid.cli:main"
stateid-mcp = "stateid.mcp_server:main"

[tool.setuptools]
packages = ["stateid", "stateid.adapters"]

[tool.setuptools.package-data]
stateid = ["*.c", "vgpu_rs/Cargo.toml", "vgpu_rs/Cargo.lock", "vgpu_rs/src/*.rs"]

[tool.setuptools.dynamic]
version = { attr = "stateid.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The virtualenv sees system packages (for PyGObject); keep ROS's pytest plugins out if they are installed.
addopts = """-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint
             -p no:ament_pep257 -p no:ament_xmllint -p no:colcon_core_warnings_stderr"""
